<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>請看台上</title>
<style>
  :root{ --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:#000;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;
    -webkit-user-select:none;user-select:none;
  }
  .screen{
    position:fixed;inset:0;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px);
    text-align:center;
  }
  .screen.on{display:flex}

  /* ---------- 入場 ---------- */
  #join h1{font-size:24px;font-weight:600;margin:0 0 8px;letter-spacing:.06em}
  #join p.lead{margin:0 0 34px;font-size:14px;color:#7e7e85;line-height:1.7}
  .field{width:100%;max-width:300px}
  #nick{
    width:100%;background:#16161b;border:1px solid #2c2c36;color:#fff;
    padding:17px 18px;border-radius:14px;font-size:17px;font-family:inherit;
    text-align:center;-webkit-user-select:text;user-select:text;
  }
  #nick:focus{outline:none;border-color:#5a5a6a;background:#1b1b21}
  #nick::placeholder{color:#4e4e58}
  #joinBtn{
    width:100%;margin-top:12px;padding:17px;border:none;border-radius:14px;
    background:#fff;color:#000;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;
  }
  #joinBtn:disabled{background:#2a2a33;color:#55555f}
  .hint{margin-top:26px;font-size:13px;line-height:1.7;color:#5f5f69;max-width:19em}

  /* ---------- 看台上 ---------- */
  #stage .who{font-size:14px;color:#5c5c63;letter-spacing:.1em;margin-bottom:18px}
  #stage .big{font-size:30px;font-weight:600;letter-spacing:.24em;text-indent:.24em;color:#e8e8ea}
  #stage .sub{margin-top:14px;font-size:14px;color:#5c5c63;letter-spacing:.1em}
  .dot{width:7px;height:7px;border-radius:50%;background:#2f6b3d;margin-top:44px;animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  /* ============ 以下照 iOS 的來電／通話畫面做 ============ */
  /* 沒有聯絡人照片時，iOS 的底是由上而下的深灰漸層，不是純黑 */
  #ring,#call{
    justify-content:space-between;
    background:linear-gradient(180deg,#4a4a4e 0%,#2a2a2e 28%,#141416 62%,#000 100%);
    padding:calc(var(--safe-t) + 6vh) 0 calc(var(--safe-b) + 26px);
  }

  .who-block{display:flex;flex-direction:column;align-items:center;width:100%}
  .mono{
    width:112px;height:112px;border-radius:50%;
    background:linear-gradient(180deg,#8e8e93,#5a5a5f);
    display:flex;align-items:center;justify-content:center;
    font-size:50px;font-weight:300;color:#fff;margin-bottom:20px;
  }
  /* iOS 的來電者名字是大字但「不粗」，這點最容易做錯 */
  .cname{font-size:38px;font-weight:400;letter-spacing:-.01em;line-height:1.15;padding:0 20px}
  .cinfo{margin-top:6px;font-size:19px;font-weight:400;color:rgba(235,235,245,.6)}

  .btn-col{display:flex;flex-direction:column;align-items:center;gap:9px}
  .btn-col span{font-size:13px;color:#fff}
  .circle{
    border-radius:50%;border:none;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .circle:active{filter:brightness(.82)}
  .circle svg{fill:#fff}

  /* 次要動作：半透明毛玻璃圓鈕 */
  .minor-row{display:flex;justify-content:center;gap:74px;margin-bottom:34px}
  .minor{
    width:58px;height:58px;
    background:rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  }
  .minor svg{width:26px;height:26px}

  /* 主要動作：iOS 上大約 76pt，靠左右兩側擺 */
  .main-row{display:flex;justify-content:space-between;padding:0 42px}
  .big-btn{width:76px;height:76px}
  .big-btn svg{width:33px;height:33px}
  .decline{background:#ff3b30}
  .accept{background:#34c759}

  /* ---------- 通話中：iOS 的 3x2 功能格 ---------- */
  #call .cname{font-size:34px}
  .timer{margin-top:7px;font-size:19px;color:rgba(235,235,245,.6);font-variant-numeric:tabular-nums}
  .pad{
    display:grid;grid-template-columns:repeat(3,76px);
    justify-content:center;gap:26px 38px;margin-bottom:30px;
  }
  .pad .btn-col span{color:rgba(235,235,245,.85)}
  .fn{
    width:76px;height:76px;
    background:rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  }
  .fn svg{width:31px;height:31px}
  .fn.act-on{background:#fff}
  .fn.act-on svg{fill:#000}
  .end-row{display:flex;justify-content:center}

  .err{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 6px);
       font-size:12px;color:#8a6d3b;text-align:center;padding:0 20px}

  /* ============ 模擬 App：照 iOS 深色 insetGrouped 清單做 ============ */
  /* 這一頁是唯一要捲動的畫面，所以不跟其他畫面一樣置中，改成上中下撐滿 */
  #app{
    padding:0;background:#000;
    align-items:stretch;justify-content:flex-start;text-align:left;
  }
  .navbar{flex:none;padding:calc(var(--safe-t) + 12px) 20px 6px}
  .navbar .eyebrow{font-size:13px;color:#8e8e93;letter-spacing:.02em}
  .navbar h2{margin:1px 0 0;font-size:33px;font-weight:700;letter-spacing:-.02em;color:#fff}

  /* 兩個分頁各自保留自己的捲動位置，跟原生 TabView 一樣 */
  .pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 16px 26px}
  .pane[hidden]{display:none}
  .lead{margin:0 4px 18px;font-size:15px;line-height:1.55;color:#98989f}
  .sec{margin:0 4px 7px;font-size:13px;color:#8e8e93;letter-spacing:.02em}

  .list{background:#1c1c1e;border-radius:11px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 15px;position:relative}
  /* iOS 的分隔線從文字起點開始，不是整條拉到底 */
  .row + .row::before{content:"";position:absolute;left:15px;right:0;top:0;height:.5px;background:#38383a}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:17px;line-height:1.3;color:#fff}
  .row-detail{margin-top:3px;font-size:13px;line-height:1.45;color:#8e8e93}
  .badge{
    flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;
    color:#0a84ff;background:rgba(10,132,255,.16);
  }
  /* 舊的那頁用灰的；兩頁來回切的時候，顏色比文字更快讓人分辨現在在哪 */
  #pane-old .badge{color:#8e8e93;background:rgba(142,142,147,.18)}
  .foot{margin:14px 4px 0;font-size:12px;line-height:1.6;color:#636369}

  .tabbar{
    display:flex;flex:none;border-top:.5px solid #2c2c2e;
    background:rgba(20,20,22,.94);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    padding-bottom:var(--safe-b);
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 0 4px;border:none;background:none;color:#8e8e93;
    font-family:inherit;cursor:pointer;
  }
  .tab svg{width:26px;height:26px;fill:currentColor}
  .tab span{font-size:10px;font-weight:500}
  .tab.sel{color:#0a84ff}

  /* 矮螢幕（Safari 有網址列時空間很緊）縮一點，確保按鈕不會被切掉 */
  @media (max-height:700px){
    #ring,#call{padding-top:calc(var(--safe-t) + 3vh)}
    .mono{width:92px;height:92px;font-size:42px;margin-bottom:14px}
    .cname{font-size:32px}
    #call .cname{font-size:28px}
    .pad{grid-template-columns:repeat(3,68px);gap:18px 32px}
    .fn{width:68px;height:68px}
    .minor-row{margin-bottom:24px;gap:64px}
  }
</style>
</head>
<body>

<!-- 這個「加入」是整套流程的關鍵：它同時是 iOS 的音訊解鎖手勢 -->
<div class="screen on" id="join">
  <h1>歡迎加入</h1>
  <p class="lead">輸入一個暱稱，方便活動後對名單</p>
  <div class="field">
    <input id="nick" type="text" inputmode="text" maxlength="24" autocomplete="nickname"
           placeholder="你的暱稱" enterkeyhint="go">
    <button id="joinBtn" disabled>加入</button>
  </div>
  <p class="hint">請把音量轉大<br>加入後請看台上</p>
</div>

<div class="screen" id="stage">
  <div class="who" id="whoami"></div>
  <div class="big">請看台上</div>
  <div class="sub">保持這個畫面不要關掉</div>
  <div class="dot" id="dot"></div>
</div>

<!-- ===== 來電 ===== -->
<div class="screen" id="ring">
  <div class="who-block">
    <div class="mono" id="avatar">林</div>
    <div class="cname" id="ringName">林楷祐</div>
    <div class="cinfo" id="ringInfo">iPhone</div>
  </div>

  <div style="width:100%">
    <!-- iOS 在拒絕／接聽上面還有這兩顆，少了它就不像 -->
    <div class="minor-row">
      <div class="btn-col">
        <button class="circle minor" aria-label="提醒我">
          <svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zm0 15.4a6.9 6.9 0 1 1 0-13.8 6.9 6.9 0 0 1 0 13.8zm.8-11h-1.6v5.2l4.1 2.5.8-1.3-3.3-2z"/><path d="M4.9 1.5 1.4 4.4l1.3 1.5L6.2 3zm14.2 0-1.3 1.5 3.5 2.9 1.3-1.5z"/></svg>
        </button>
        <span>提醒我</span>
      </div>
      <div class="btn-col">
        <button class="circle minor" aria-label="訊息">
          <svg viewBox="0 0 24 24"><path d="M12 3.2c-5.1 0-9.2 3.4-9.2 7.6 0 2.4 1.3 4.5 3.4 5.9-.2 1-.8 2.2-1.7 3.1-.2.2 0 .6.3.5 1.9-.3 3.6-1.1 4.6-1.9.8.2 1.7.3 2.6.3 5.1 0 9.2-3.4 9.2-7.9S17.1 3.2 12 3.2z"/></svg>
        </button>
        <span>訊息</span>
      </div>
    </div>

    <div class="main-row">
      <div class="btn-col">
        <button class="circle big-btn decline" id="declineBtn" aria-label="拒絕">
          <svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
        </button>
        <span>拒絕</span>
      </div>
      <div class="btn-col">
        <button class="circle big-btn accept" id="acceptBtn" aria-label="接聽">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
        </button>
        <span>接聽</span>
      </div>
    </div>
  </div>
</div>

<!-- ===== 通話中 ===== -->
<div class="screen" id="call">
  <div class="who-block">
    <div class="cname" id="callName">林楷祐</div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div style="width:100%">
    <div class="pad">
      <div class="btn-col">
        <button class="circle fn" id="muteBtn" aria-label="靜音">
          <svg viewBox="0 0 24 24"><path d="M12 14.6c1.7 0 3-1.4 3-3.1V5.9c0-1.7-1.3-3.1-3-3.1S9 4.2 9 5.9v5.6c0 1.7 1.3 3.1 3 3.1z"/><path d="M17.4 11.5c0 3-2.4 5.4-5.4 5.4s-5.4-2.4-5.4-5.4H5c0 3.5 2.6 6.5 6 7v3h2v-3c3.4-.5 6-3.5 6-7h-1.6z"/></svg>
        </button>
        <span>靜音</span>
      </div>
      <div class="btn-col">
        <button class="circle fn" aria-label="鍵盤">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="5.5" r="1.9"/><circle cx="12" cy="5.5" r="1.9"/><circle cx="18" cy="5.5" r="1.9"/><circle cx="6" cy="11.5" r="1.9"/><circle cx="12" cy="11.5" r="1.9"/><circle cx="18" cy="11.5" r="1.9"/><circle cx="6" cy="17.5" r="1.9"/><circle cx="12" cy="17.5" r="1.9"/><circle cx="18" cy="17.5" r="1.9"/></svg>
        </button>
        <span>鍵盤</span>
      </div>
      <div class="btn-col">
        <button class="circle fn" id="spkBtn" aria-label="擴音">
          <svg viewBox="0 0 24 24"><path d="M11 4.5 6.8 8H3.5v8h3.3L11 19.5z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8l1.3 1.3a6.6 6.6 0 0 0 0-9.4z"/><path d="M18.1 5.9a8.6 8.6 0 0 1 0 12.2l1.3 1.3a10.4 10.4 0 0 0 0-14.8z"/></svg>
        </button>
        <span>擴音</span>
      </div>
      <div class="btn-col">
        <button class="circle fn" aria-label="新增通話">
          <svg viewBox="0 0 24 24"><path d="M11 5h2v14h-2z"/><path d="M5 11h14v2H5z"/></svg>
        </button>
        <span>新增通話</span>
      </div>
      <div class="btn-col">
        <button class="circle fn" aria-label="FaceTime">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="12.5" height="12" rx="3"/><path d="M16.5 11.2 21.5 8v8l-5-3.2z"/></svg>
        </button>
        <span>FaceTime</span>
      </div>
      <div class="btn-col">
        <button class="circle fn" aria-label="聯絡資訊">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M12 13.4c-3.6 0-6.5 2.2-6.5 4.4 0 .9.7 1.2 1.6 1.2h9.8c.9 0 1.6-.3 1.6-1.2 0-2.2-2.9-4.4-6.5-4.4z"/></svg>
        </button>
        <span>聯絡資訊</span>
      </div>
    </div>

    <div class="end-row">
      <button class="circle big-btn decline" id="hangup" aria-label="結束">
        <svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ===== 模擬 App：讓台下自己切著看新舊差在哪 ===== -->
<div class="screen" id="app">
  <div class="navbar">
    <div class="eyebrow" id="appName"></div>
    <h2 id="appTitle"></h2>
  </div>

  <!-- 兩個 pane 都留在 DOM 裡，切回來時捲動位置還在 -->
  <div class="pane" id="pane-new" role="tabpanel" aria-labelledby="tab-new"></div>
  <div class="pane" id="pane-old" role="tabpanel" aria-labelledby="tab-old" hidden></div>

  <div class="tabbar" role="tablist">
    <button class="tab sel" id="tab-new" data-tab="new" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M10.5 4.2l1.7 5.6 5.6 1.7-5.6 1.7-1.7 5.6-1.7-5.6-5.6-1.7 5.6-1.7z"/><path d="M18.8 2.4l.8 2.8 2.8.8-2.8.8-.8 2.8-.8-2.8-2.8-.8 2.8-.8z"/></svg>
      <span></span>
    </button>
    <button class="tab" id="tab-old" data-tab="old" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A8.5 8.5 0 0 0 12 3.5zm0 15.4a6.9 6.9 0 1 1 6.9-6.9 6.9 6.9 0 0 1-6.9 6.9z"/><path d="M12.8 7.5h-1.6v5.2l4.1 2.5.8-1.3-3.3-2z"/></svg>
      <span></span>
    </button>
  </div>
</div>

<!-- 兩個 source：有 ringtone.mp3 就用它，沒有就自動退回合成的 wav。
     用瀏覽器原生的 source fallback，不必用 JS 探測，也就沒有
     「探測還沒回來使用者就按了加入」的競態問題。 -->
<audio id="ringAudio" loop preload="auto" playsinline>
  <source src="/ringtone.mp3" type="audio/mpeg">
  <source src="/ringtone.wav" type="audio/wav">
</audio>
<audio id="recAudio" preload="auto" playsinline></audio>
<div class="err" id="err"></div>

<script>
// ===== 要改的東西都在這 =====
const CONFIG = {
  callerName: "林楷祐",
  callerInfo: "iPhone",                     // iOS 顯示的是號碼標籤，就是「iPhone」這兩個字
  avatarText: "林",
  recording: "/recording.mp3",              // 放你的錄音；找不到會自動退回下面那個
  fallbackRecording: "/placeholder-recording.wav",
  room: new URLSearchParams(location.search).get("room") || "main",
};

// 模擬 App 畫面的內容全部從這裡出來。想換就改這一塊，不用動下面的程式。
// items 每一列：title 必填，detail、badge 可省略。
const APP_CONFIG = {
  appName: "我的 App",
  tabs: {
    new: {
      title: "新的",                     // 分頁列上的字
      nav: "新版",                       // 切到這頁時的大標題
      lead: "改版後長這樣。",
      section: "這一版改了什麼",
      items: [
        { title: "第一個改動", detail: "一句話說明它解決了什麼", badge: "NEW" },
        { title: "第二個改動", detail: "一句話說明它解決了什麼", badge: "NEW" },
        { title: "第三個改動", detail: "一句話說明它解決了什麼" },
      ],
      foot: "改 index.html 最上面的 APP_CONFIG 就會換掉這兩頁。",
    },
    old: {
      title: "舊的",
      nav: "舊版",
      lead: "改版前長這樣。",
      section: "原本是怎麼做的",
      items: [
        { title: "第一個改動", detail: "原本的做法，以及卡在哪", badge: "舊" },
        { title: "第二個改動", detail: "原本的做法，以及卡在哪", badge: "舊" },
        { title: "第三個改動", detail: "原本的做法，以及卡在哪" },
      ],
    },
  },
};
// ============================

const $ = (id) => document.getElementById(id);
const ringAudio = $("ringAudio"), recAudio = $("recAudio");
let rev = -1, myChoice = null, ws = null, timerId = null, wakeLock = null;
let myName = "", ringTimer = null;

// 對時：每支手機的系統時間都不一樣，要能換算成伺服器時間，
// 才有辦法「大家同一刻響」。用 RTT 折半估時差，取最快那一次。
let clockOffset = 0, bestRtt = Infinity;   // 伺服器時間 ≈ 本機時間 + clockOffset

// 音檔載完才算準備好。在線不等於準備好 —— 還在下載的人接了會是一片安靜。
let audioReady = false;
function checkAudioReady() {
  if (audioReady) return;
  if (ringAudio.readyState >= 4 && recAudio.readyState >= 4) {
    audioReady = true;
    send({ type: "ready" });
  }
}
for (const el of [ringAudio, recAudio]) {
  el.addEventListener("canplaythrough", checkAudioReady);
  el.addEventListener("loadeddata", checkAudioReady);
}
// 事件有可能在掛上監聽之前就觸發過（例如檔案已在快取），所以再輪詢兜底
setInterval(checkAudioReady, 2000);

// 裝置 id 存在 localStorage：斷線重連回來還是同一個人，不會被算成兩個
let myId = localStorage.getItem("ghostcall_id");
if (!myId) {
  myId = (crypto.randomUUID?.() || String(Math.random()).slice(2) + Date.now()).slice(0, 36);
  try { localStorage.setItem("ghostcall_id", myId); } catch {}
}

$("ringName").textContent = $("callName").textContent = CONFIG.callerName;
$("ringInfo").textContent = CONFIG.callerInfo;
$("avatar").textContent = CONFIG.avatarText;

function show(id) {
  for (const s of document.querySelectorAll(".screen")) s.classList.toggle("on", s.id === id);
}

// ---------- 模擬 App ----------
const node = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

// 用 DOM API 組，不走 innerHTML —— APP_CONFIG 裡打了 < 或 & 也不會把版面弄壞
function buildPane(pane, tab) {
  pane.replaceChildren();
  if (tab.lead) pane.append(node("p", "lead", tab.lead));
  if (tab.section) pane.append(node("div", "sec", tab.section));
  const list = node("div", "list");
  for (const it of tab.items ?? []) {
    const row = node("div", "row");
    const main = node("div", "row-main");
    main.append(node("div", "row-title", it.title));
    if (it.detail) main.append(node("div", "row-detail", it.detail));
    row.append(main);
    if (it.badge) row.append(node("span", "badge", it.badge));
    list.append(row);
  }
  pane.append(list);
  if (tab.foot) pane.append(node("p", "foot", tab.foot));
}

function selectTab(key) {
  const tab = APP_CONFIG.tabs[key];
  if (!tab) return;
  for (const b of document.querySelectorAll(".tab")) {
    const on = b.dataset.tab === key;
    b.classList.toggle("sel", on);
    b.setAttribute("aria-selected", String(on));
  }
  $("pane-new").hidden = key !== "new";
  $("pane-old").hidden = key !== "old";
  $("appTitle").textContent = tab.nav || tab.title;
}

$("appName").textContent = APP_CONFIG.appName;
for (const key of ["new", "old"]) {
  const tab = APP_CONFIG.tabs[key];
  $(`tab-${key}`).querySelector("span").textContent = tab.title;
  $(`tab-${key}`).onclick = () => selectTab(key);
  buildPane($(`pane-${key}`), tab);
}
selectTab("new");

// 每次切進來都從「新的」開始，不要留著上一輪停在哪一頁、捲到哪裡
function showApp() {
  selectTab("new");
  $("pane-new").scrollTop = $("pane-old").scrollTop = 0;
  show("app");
}

// 只是要看畫面長怎樣時用：?screen=ring、?screen=call 或 ?screen=app。
// 不會連線也不會出聲，純粹給人看版面。
const preview = new URLSearchParams(location.search).get("screen");
if (preview && document.getElementById(preview)) show(preview);

// 記住上次用的暱稱
try { $("nick").value = localStorage.getItem("ghostcall_name") || ""; } catch {}
const validName = () => $("nick").value.trim().length > 0;
const syncBtn = () => { $("joinBtn").disabled = !validName(); };
$("nick").addEventListener("input", syncBtn);
syncBtn();

// 錄音檔在不在，先探一次，免得解鎖時 play() 直接 reject
(async () => {
  let src = CONFIG.fallbackRecording;
  try {
    const r = await fetch(CONFIG.recording, { method: "HEAD" });
    if (r.ok) src = CONFIG.recording;
  } catch {}
  recAudio.src = src;
})();

// ---------- 音訊解鎖：整套體驗成立的前提 ----------
// 兩個 play() 一定要在同一個手勢事件裡「同步」發出。
// 若先 await 第一個再呼叫第二個，iOS 會判定已經脫離使用者手勢而擋掉。
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
  const jobs = [ringAudio, recAudio].map((el) => {
    let p;
    try { p = el.play(); } catch { return Promise.resolve(); }
    return Promise.resolve(p)
      .then(() => { el.pause(); el.currentTime = 0; })
      .catch(() => { $("err").textContent = "音訊可能被擋住，請確認沒有開靜音"; });
  });
  return Promise.allSettled(jobs);
}

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { keepAwake(); ensureSocket(); }
});

// ---------- 場景切換 ----------
// 從伺服器給的 at 算出這支手機還要等多久才響。
// 防呆很重要：手機時鐘本身不準的話，算出來會是個荒謬的數字，
// 那個人就永遠不會響 —— 而你在現場完全看不出來。所以超出
// 伺服器允許的最大延遲就當作時鐘壞了，寧可立刻響。
// （test/schedule.mjs 會把這個函式原封不動抽出來驗，不要改名）
function ringDelay(at, offset, now) {
  const raw = at - offset - now;
  return raw < 0 || raw > 12000 ? 0 : raw;
}

function applyState(st) {
  if (st.rev === rev) return;
  rev = st.rev;
  myChoice = null;
  clearTimeout(ringTimer);
  stopRing();
  stopRecording();

  if (st.scene === "app") return showApp();
  if (st.scene !== "ringing") { show("stage"); return; }

  const wait = ringDelay(st.at ?? 0, clockOffset, Date.now());
  if (wait < 30) return startRinging();
  show("stage");                       // 還沒到時間，畫面先不要動
  ringTimer = setTimeout(startRinging, wait);
}

function startRinging() {
  show("ring");
  ringAudio.currentTime = 0;
  ringAudio.play().catch(() => {
    $("err").textContent = "鈴聲被擋住了，但畫面是對的，可以直接接聽";
  });
  navigator.vibrate?.([600, 400, 600, 400, 600, 2000]);   // iOS 不支援，Android 才有
}

function stopRing() {
  ringAudio.pause();
  ringAudio.currentTime = 0;
  navigator.vibrate?.(0);
}

function stopRecording() {
  recAudio.pause();
  clearInterval(timerId);
}

function report(choice) {
  if (myChoice) return;
  myChoice = choice;
  send({ type: "choice", choice, rev });
}

$("acceptBtn").onclick = () => {
  stopRing();
  report("answer");
  // 每次接聽都把功能格重置，不要把上一輪按過的靜音留著
  $("muteBtn").classList.remove("act-on");
  $("spkBtn").classList.remove("act-on");
  recAudio.muted = false;
  show("call");
  const t0 = Date.now();
  const tick = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("timer").textContent =
      String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  tick();
  timerId = setInterval(tick, 500);
  recAudio.currentTime = 0;
  recAudio.play().catch(() => { $("err").textContent = "錄音播不出來，請檢查音量"; });
  recAudio.onended = () => { stopRecording(); show("stage"); };
};

$("declineBtn").onclick = () => { stopRing(); report("decline"); show("stage"); };
$("hangup").onclick = () => { stopRecording(); show("stage"); };

// 靜音是真的會靜音，跟真的通話一樣；其他幾顆只有亮暗
$("muteBtn").onclick = (e) => {
  recAudio.muted = e.currentTarget.classList.toggle("act-on");
};
$("spkBtn").onclick = (e) => e.currentTarget.classList.toggle("act-on");

function doJoin() {
  if (!validName()) return;
  myName = $("nick").value.trim().slice(0, 24);
  try { localStorage.setItem("ghostcall_name", myName); } catch {}
  unlockAudio();                 // 必須在這個手勢裡呼叫，不能放到 await 之後
  keepAwake();
  $("whoami").textContent = myName;
  show("stage");
  ensureSocket();
}
$("joinBtn").onclick = doJoin;
$("nick").addEventListener("keydown", (e) => { if (e.key === "Enter") doJoin(); });

// ---------- 連線：重連要有抖動，不然 400 人會同時湧回來 ----------
let retries = 0, pingId = null;

function send(obj) {
  try { if (ws?.readyState === 1) ws.send(JSON.stringify(obj)); } catch {}
}

function ensureSocket() {
  if (!myName) return;                                   // 還沒填暱稱就先不連
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(CONFIG.room)}`);

  ws.onopen = () => {
    retries = 0;
    $("dot").style.background = "#2f6b3d";
    // 每次連上都要重報一次：伺服器端重連後是一條全新的連線，不記得你是誰
    send({ type: "join", id: myId, name: myName });
    // 重連後伺服器是一條全新連線，不記得你載好音檔了，要重報
    if (audioReady) send({ type: "ready" });
    for (let i = 0; i < 3; i++) setTimeout(() => send({ type: "sync", c: Date.now() }), i * 400);
    clearInterval(pingId);
    // "p" 走 DO 的 auto-response：不喚醒物件、不計費
    pingId = setInterval(() => { if (ws?.readyState === 1) ws.send("p"); }, 25000);
  };

  ws.onmessage = (e) => {
    if (e.data === "P") return;
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "state") applyState(m);
    if (m.type === "sync") {
      const rtt = Date.now() - m.c;
      if (rtt < bestRtt) { bestRtt = rtt; clockOffset = m.s - (m.c + rtt / 2); }
    }
  };

  ws.onclose = () => {
    $("dot").style.background = "#6b2f2f";
    clearInterval(pingId);
    const base = Math.min(1000 * 2 ** retries++, 15000);
    setTimeout(ensureSocket, base * (0.5 + Math.random()));   // 抖動
  };

  ws.onerror = () => { try { ws.close(); } catch {} };
}
</script>
</body>
</html>
